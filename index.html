<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ランダム画像ビューア</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f2f2;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#222}
main{width:min(92vw,700px);text-align:center;padding:24px}
h1{font-size:clamp(24px,6vw,40px);margin:0 0 20px}
button{font-size:20px;font-weight:700;padding:14px 28px;border:0;border-radius:12px;cursor:pointer;background:#222;color:#fff}
button:active{transform:scale(.98)}
#result{margin:24px auto 0;min-height:160px;display:grid;place-items:center}
#result img{max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 8px 30px #0002}
#hint{color:#666;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<main>
<h1>ランダム画像ビューア</h1>
<button id="draw">画像を表示する</button>
<div id="result"><p id="hint">ボタンを押すと画像がランダムに表示されます。</p></div>
</main>
<script>
const images = [
  'images/73852.jpg','images/73899.jpg','images/73900.jpg','images/73901.jpg',
  'images/73902.jpg','images/73903.jpg','images/73904.jpg'
];
const result=document.getElementById('result');
document.getElementById('draw').addEventListener('click',()=>{
  const src=images[Math.floor(Math.random()*images.length)];
  result.innerHTML='';
  const img=new Image();
  img.alt='ランダムに選ばれた画像';
  img.src=src;
  result.appendChild(img);
});
</script>
</body>
</html>
